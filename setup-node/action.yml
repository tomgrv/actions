# @format

# @package tomgrv/actions/setup-node

name: Setup Node.js
description: Shared Node.js and npm setup for PR validation actions.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  cache:
    description: Supported package manager
    required: false
    default: 'npm'
  node-version:
    description: Node.js version to set up. Defaults to version specified in package.json or 24.
    required: false
    default: '24'
  options:
    description: Additional arguments to pass to the install command. includes --no-progress and --workspaces by default.
    required: false
    default: ''
  bare:
    description: >-
      If true, skips the `npm ci` step. Useful for actions that only need
      Node.js and npm available, but not the project's dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      id: node-setup
      # Guards against redundant reinstalls when several actions in this
      # repository each embed setup-node within the same job.
      if: env.TOMGRV_NODE_SETUP != 'true'
      with:
        # actions/setup-node fails outright (rather than skipping) when
        # asked to cache a package manager with no lock file present, so
        # only request caching once a lock file actually exists.
        cache: ${{ hashFiles('package-lock.json') && inputs.cache || '' }}
        node-version: ${{ inputs.node-version }}

    - name: Prepare Node workspace
      if: env.TOMGRV_NODE_SETUP != 'true'
      shell: sh
      run: sh "${{ github.action_path }}/prepare.sh" "${{ inputs.bare }}" "${{ inputs.options }}"

# @format

# @package tomgrv/actions/setup-gitversion

name: Setup GitVersion
description: Idempotently install the gitversion devcontainer feature's toolchain (docker-wrapped GitVersion CLI plus the gv/bump-tag/bump-changelog/bump-version bin scripts).
author: Perspikapps
branding:
  icon: tag
  color: blue

inputs:
  gitversion-version:
    description: Tag of the gittools/gitversion Docker image the `gitversion` wrapper runs.
    required: false
    default: '6.5.1'

runs:
  using: composite
  steps:
    - name: Setup scripts toolchain
      uses: $/setup-scripts
      with:
        scripts: zz-log gv bump-tag bump-changelog bump-version

    # The image archive written by run.sh (docker save) is the only thing
    # cached: a miss just means run.sh pulls the image from Docker Hub as before.
    - name: Cache GitVersion image
      uses: actions/cache@v5
      with:
        path: ~/.cache/gitversion
        key: gitversion-image-${{ runner.os }}-${{ inputs.gitversion-version }}

    - name: Install GitVersion toolchain
      shell: sh
      env:
        GITVERSION_VERSION: ${{ inputs.gitversion-version }}
      run: sh -c "${{ github.action_path }}/run.sh"

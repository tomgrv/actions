# @format

# @package tomgrv/actions/check-laravel

name: Validate PR Laravel
description: Run the standard Laravel PHP check suite (PHPStan, Pint, PHP Insights, PHPMD, tests) and report via reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting, shared by every wrapped check.
    required: false
    default: ${{ github.token }}
  paths:
    description: >-
      Comma-separated list of paths to analyze with PHPStan, Pint, PHP Insights and PHPMD. 
      Defaults to `app`, filtered by `dirty` and `wip` if enabled. 
      Shared by every wrapped check that supports it (PHPStan, Pint, PHP Insights, PHPMD).
    required: false
    default: app
  dirty:
    description: Only analyze files with uncommitted git changes, shared by every wrapped check that supports it (PHPStan, Pint, PHP Insights, PHPMD).
    required: false
    default: 'false'
  wip:
    description: Only analyze files changed on the current pull request (relative to its base branch), shared by every wrapped check that supports it (PHPStan, Pint, PHP Insights, PHPMD).
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  phpstan:
    description: Whether to run PHPStan.
    required: false
    default: 'true'
  pint:
    description: Whether to run Pint.
    required: false
    default: 'true'
  pint-blade:
    description: >-
      Format `.blade.php` files too when Pint runs (Pint's `--blade` flag,
      added in Pint 1.30). Requires `prettier`, `prettier-plugin-blade` and
      `prettier-plugin-tailwindcss` available in the repository.
    required: false
    default: 'false'
  phpinsights:
    description: Whether to run PHP Insights.
    required: false
    default: 'false'
  phpmd:
    description: Whether to run PHPMD.
    required: false
    default: 'false'
  tests:
    description: Whether to run the test suite.
    required: false
    default: 'false'
  level:
    description: 'Report level for reviewdog [info,warning,error], shared by every wrapped check.'
    required: false
    default: error
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error], shared by every wrapped check.'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags, shared by every wrapped check.
    required: false
    default: ''

outputs:
  tests-passed:
    description: Whether the test suite passed.
    value: ${{ steps.tests.outputs.tests-passed }}
  coverage-file:
    description: Path of the generated coverage report, empty when no report was produced.
    value: ${{ steps.tests.outputs.coverage-file }}
  junit-file:
    description: Path of the generated JUnit report, empty when no report was produced.
    value: ${{ steps.tests.outputs.junit-file }}

runs:
  using: composite
  steps:
    # Every wrapped check below forwards the same github-token, level,
    # fail-level and reviewdog-flags inputs, so this action's reviewdog
    # context is inherited consistently rather than each check silently
    # falling back to its own separately-configured default. filter-mode is
    # not forwarded: each wrapped check fixes it to `file` as a run-* action.
    # Each of these actions embeds setup-php/setup-reviewdog itself; only the
    # first one in this job actually installs anything, the rest detect the
    # TOMGRV_PHP_SETUP/REVIEWDOG_SETUP markers and skip straight through.
    - name: Run PHPStan
      id: phpstan
      if: inputs.phpstan == 'true'
      continue-on-error: true
      uses: $/run-phpstan
      with:
        github-token: ${{ inputs.github-token }}
        paths: ${{ inputs.paths }}
        dirty: ${{ inputs.dirty }}
        wip: ${{ inputs.wip }}
        wip-base-ref: ${{ inputs.wip-base-ref }}
        level: ${{ inputs.level }}
        fail-level: ${{ inputs.fail-level }}
        reviewdog-flags: ${{ inputs.reviewdog-flags }}

    - name: Run Pint
      id: pint
      if: inputs.pint == 'true'
      continue-on-error: true
      uses: $/run-pint
      with:
        github-token: ${{ inputs.github-token }}
        paths: ${{ inputs.paths }}
        dirty: ${{ inputs.dirty }}
        wip: ${{ inputs.wip }}
        wip-base-ref: ${{ inputs.wip-base-ref }}
        blade: ${{ inputs.pint-blade }}
        level: ${{ inputs.level }}
        fail-level: ${{ inputs.fail-level }}
        reviewdog-flags: ${{ inputs.reviewdog-flags }}

    - name: Run PHP Insights
      id: phpinsights
      if: inputs.phpinsights == 'true'
      continue-on-error: true
      uses: $/run-phpinsights
      with:
        github-token: ${{ inputs.github-token }}
        paths: ${{ inputs.paths }}
        dirty: ${{ inputs.dirty }}
        wip: ${{ inputs.wip }}
        wip-base-ref: ${{ inputs.wip-base-ref }}
        level: ${{ inputs.level }}
        fail-level: ${{ inputs.fail-level }}
        reviewdog-flags: ${{ inputs.reviewdog-flags }}

    - name: Run PHPMD
      id: phpmd
      if: inputs.phpmd == 'true'
      continue-on-error: true
      uses: $/run-phpmd
      with:
        github-token: ${{ inputs.github-token }}
        paths: ${{ inputs.paths }}
        dirty: ${{ inputs.dirty }}
        wip: ${{ inputs.wip }}
        wip-base-ref: ${{ inputs.wip-base-ref }}
        level: ${{ inputs.level }}
        fail-level: ${{ inputs.fail-level }}
        reviewdog-flags: ${{ inputs.reviewdog-flags }}

    - name: Run test suite
      id: tests
      if: inputs.tests == 'true'
      continue-on-error: true
      uses: $/run-phptests
      with:
        github-token: ${{ inputs.github-token }}
        level: ${{ inputs.level }}
        fail-level: ${{ inputs.fail-level }}
        reviewdog-flags: ${{ inputs.reviewdog-flags }}

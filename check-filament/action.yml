# @format

# @package tomgrv/actions/check-filament

name: Validate PR Filament
description: Run Filament-specific checks (FilaCheck) and report via reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  path:
    description: Path to analyze with FilaCheck. Defaults to `app/Filament`.
    required: false
    default: app/Filament
  fix:
    description: Apply fixes directly instead of reporting via reviewdog.
    required: false
    default: 'false'
  detailed:
    description: Show detailed output with rule categories.
    required: false
    default: 'false'
  dirty:
    description: Only scan files with uncommitted git changes.
    required: false
    default: 'false'
  wip:
    description: Only scan files changed on the current pull request (relative to its base branch).
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  dry-run:
    description: Preview fix changes without modifying files.
    required: false
    default: 'false'
  backup:
    description: Create backup files when fixing.
    required: false
    default: 'false'
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: 'Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].'
    required: false
    default: github-pr-check
  filter-mode:
    description: 'Filtering mode for the reviewdog command [added,diff_context,file,nofilter].'
    required: false
    default: ''
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

outputs:
  has-changes:
    description: Whether fix mode produced local changes.
    value: ${{ steps.filacheck.outputs.has-changes }}

runs:
  using: composite
  steps:
    # Same github-token/level/reporter/filter-mode/fail-level/reviewdog-flags
    # inputs are forwarded as-is to run-filacheck, so this action's reviewdog
    # context (and github-token) is always the one actually used by the
    # underlying tool call, never a separately-defaulted one.
    - name: Run FilaCheck
      id: filacheck
      if: ${{hashFiles( inputs.path)}}
      uses: $/run-filacheck
      with:
        github-token: ${{ inputs.github-token }}
        path: ${{ inputs.path }}
        fix: ${{ inputs.fix }}
        detailed: ${{ inputs.detailed }}
        dirty: ${{ inputs.dirty }}
        wip: ${{ inputs.wip }}
        wip-base-ref: ${{ inputs.wip-base-ref }}
        dry-run: ${{ inputs.dry-run }}
        backup: ${{ inputs.backup }}
        level: ${{ inputs.level }}
        reporter: ${{ inputs.reporter }}
        filter-mode: ${{ inputs.filter-mode }}
        fail-level: ${{ inputs.fail-level }}
        reviewdog-flags: ${{ inputs.reviewdog-flags }}

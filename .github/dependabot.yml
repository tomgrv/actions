# @format

# Keep the third-party GitHub Actions used across .github/workflows/*.yml and
# every composite action's action.yml (actions/checkout, setup-php,
# reviewdog, ...) up to date. Dependabot's github-actions ecosystem scans the
# whole repository tree under `directory`, not just .github/workflows/, so a
# single entry covers both workflows and composite actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    # No `include: scope`: it adds `(deps)`, which commitlint's workspace-scopes
    # list rejects, so dependabot PR titles would fail validate-pr-title.
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - github-actions

# @format

name: Validate PR Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '*/run.bats'
      - 'run-tests.sh'
      - '.github/workflows/validate-pr-tests.yml'
  pull_request:
    paths:
      - '*/run.bats'
      - 'run-tests.sh'
      - '.github/workflows/validate-pr-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Run repository tests (non-PHP)
        run: ./run-tests.sh -f "resolve-environment|detect-changes|list-dirty|list-packages|list-wip|check-dockerfile|check-security|config-bot|split-package|run-deployer"

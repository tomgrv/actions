# @format

name: Validate PR Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '*/run.bats'
      - 'run-tests.sh'
      - '.github/workflows/validate-pr-tests.yml'
  pull_request:
    paths:
      - '*/run.bats'
      - 'run-tests.sh'
      - '.github/workflows/validate-pr-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run all repository tests
        run: ./run-tests.sh

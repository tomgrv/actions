# @format

name: Validate PR Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '*/run.bats'
      - 'run-tests.sh'
      - '.github/workflows/validate-pr-tests.yml'
  pull_request:
    paths:
      - '*/run.bats'
      - 'run-tests.sh'
      - '.github/workflows/validate-pr-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Run repository tests
        run: ./run-tests.sh -f "check-dockerfile|check-security|config-bot|detect-changes|resolve-environment|run-deployer"

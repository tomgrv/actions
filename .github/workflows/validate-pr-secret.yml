# @format

name: Validate PR Secrets
on:
  pull_request:
    types:
      - opened
      - ready_for_review
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate-pr-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate PR secrets
        if: ${{ secrets.GITLEAKS_LICENSE != '' }}
        uses: tomgrv/actions/check-secret@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}

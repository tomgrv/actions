# @format

name: Test workspaces
on:
    push:
        branches:
            - main
            - develop
        paths:
            - '*/run.bats'
            - '*/package.json'
            - list-packages/**
            - run-workspace-tests/**
            - .github/workflows/test-workspaces.yaml
    pull_request:
        paths:
            - '*/run.bats'
            - '*/package.json'
            - list-packages/**
            - run-workspace-tests/**
            - .github/workflows/test-workspaces.yaml
permissions:
    contents: read
jobs:
    list-packages:
        runs-on: ubuntu-latest
        outputs:
            packages: ${{ steps.list.outputs.packages }}
        steps:
            - uses: actions/checkout@v7
            - name: List packages
              id: list
              uses: ./list-packages
              with:
                  require-repository: 'false'
            - name: List packages
              id: list
              uses: tomgrv/actions/list-packages@v2
              with:
                  require-repository: 'false'
    test:
        needs: list-packages
        if: needs.list-packages.outputs.packages != '[]'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.list-packages.outputs.packages) }}
        steps:
            - uses: actions/checkout@v7
            - name: Setup Bats
              uses: bats-core/bats-action@4.0.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Run workspace tests
              uses: ./run-workspace-tests
              with:
                  workspace: ${{ matrix.package.path }}
            - name: Run workspace tests
              uses: tomgrv/actions/run-workspace-tests@v2
              with:
                  workspace: ${{ matrix.package.path }}
    repo-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Setup Bats
              uses: bats-core/bats-action@4.0.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Run repo-wide tests
              run: |
                  if compgen -G ".repo/tests/*.bats" > /dev/null; then
                    bats .repo/tests/
                  else
                    echo "No repo-wide tests under .repo/tests/, skipping."
                  fi

# @format

name: 'Release Main'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run through beta/prod without pushing to main (verification only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Release promote
        uses: ./release-promote
        with:
          # TODO: pin to a released tag of tomgrv/scripts once that repo's
          # own multi-repo-consistency PR merges and tags.
          scripts-ref: claude/multi-repo-consistency-release-7se0jy
          dry-run: ${{ inputs.dry_run == true }}

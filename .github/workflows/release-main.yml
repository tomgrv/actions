# @format

name: 'Release Main'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run through beta/prod without pushing to main (verification only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-main:
    uses: ./.github/workflows/release-promote.yml
    with:
      # TODO: pin to a released tag of tomgrv/scripts once that repo's own
      # multi-repo-consistency PR merges and tags.
      scripts_ref: claude/multi-repo-consistency-release-7se0jy
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit

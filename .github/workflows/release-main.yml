# @format

name: 'Release Main'

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Set up Node.js
        uses: tomgrv/actions/setup-node@v0

      - name: Install GitUtils
        run: npm exec --yes -- tomgrv/devcontainer-features -- gitutils

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release develop to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git beta && git prod

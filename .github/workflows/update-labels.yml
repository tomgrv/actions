# @format

name: 'Update Labels'
on:
  schedule:
    - cron: 0 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
  issues: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  update-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: tomgrv/actions/setup-node@v3
      - name: Update labels
        uses: tomgrv/actions/update-labels@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          labels-file: .github/labels.json

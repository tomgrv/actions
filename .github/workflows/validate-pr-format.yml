# @format

name: Validate PR Title
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
permissions:
  contents: read
  pull-requests: write
jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate and autocorrect PR title if needed
        uses: tomgrv/actions/check-pr-format@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fix: true
      - name: Validate PR title
        uses: tomgrv/actions/check-pr-format@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fix: true
  check-pr-source-branch:
    name: Validate PR source branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check PR source branch
        uses: tomgrv/actions/check-pr-source-branch@v2

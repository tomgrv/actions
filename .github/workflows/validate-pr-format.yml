# @format

name: Validate PR Title

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and autocorrect PR title if needed
        uses: tomgrv/actions/check-pr-format@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fix: true

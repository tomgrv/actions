# @format

# @package tomgrv/actions/run-filacheck

name: Validate PR FilaCheck
description: Run FilaCheck with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  path:
    description: Path to analyze with FilaCheck. Defaults to `app/Filament`.
    required: false
    default: app/Filament
  fix:
    description: Apply fixes directly instead of reporting via reviewdog.
    required: false
    default: 'false'
  detailed:
    description: Show detailed output with rule categories.
    required: false
    default: 'false'
  dirty:
    description: Only scan files with uncommitted git changes.
    required: false
    default: 'false'
  wip:
    description: >-
      Only scan files changed on the current pull request (relative to its
      base branch). FilaCheck has no native flag for this, so it is
      emulated by resolving the changed files and passing that explicit
      list in place of `path`.
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  dry-run:
    description: Preview fix changes without modifying files.
    required: false
    default: 'false'
  backup:
    description: Create backup files when fixing.
    required: false
    default: 'false'
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: filacheck
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: >-
      Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].
      Defaults to the reporter resolved by setup-reviewdog for this run's
      context (github-pr-check on pull requests, github-check otherwise).
    required: false
    default: ''
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

outputs:
  has-changes:
    description: Whether fix mode produced local changes.
    value: ${{ steps.run-filacheck.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php
      with:
        require: laraveldaily/filacheck

    - name: Setup reviewdog toolchain
      uses: $/setup-reviewdog
      with:
        github-token: ${{ inputs.github-token }}

    - name: List WIP files
      id: list-wip
      if: inputs.wip == 'true'
      uses: $/list-wip
      with:
        path: ${{ inputs.path }}
        extensions: php,blade.php
        base-ref: ${{ inputs.wip-base-ref }}

    - name: Run FilaCheck
      id: run-filacheck
      shell: sh
      env:
        FILACHECK_PATH: ${{ inputs.path }}
        FIX: ${{ inputs.fix }}
        DETAILED: ${{ inputs.detailed }}
        DIRTY: ${{ inputs.dirty }}
        WIP: ${{ inputs.wip }}
        WIP_FILES: ${{ steps.list-wip.outputs.files }}
        DRY_RUN: ${{ inputs.dry-run }}
        BACKUP: ${{ inputs.backup }}
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
      run: sh -c "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

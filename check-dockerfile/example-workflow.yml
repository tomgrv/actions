name: Docker Validation
on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile*'
      - '.dockerignore'
      - '.github/workflows/docker*.yml'
  pull_request:
    paths:
      - 'Dockerfile*'
      - '.dockerignore'

jobs:
  docker-check:
    name: Check Dockerfile Best Practices
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile best practices
        id: docker-check
        uses: tomgrv/actions/check-dockerfile@claude/check-dockerfile-action-dvifwd
        with:
          dockerfile-path: ./Dockerfile
          strict: 'false'

      - name: Report results
        if: always()
        run: |
          echo "### 🐳 Dockerfile Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issues Found:** ${{ steps.docker-check.outputs.issues-found }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Passed Checks:** ${{ steps.docker-check.outputs.checks-passed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed Checks:** ${{ steps.docker-check.outputs.checks-failed }}" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.docker-check.outputs.issues-found != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issuesCount = '${{ steps.docker-check.outputs.issues-found }}';
            const failedChecks = '${{ steps.docker-check.outputs.checks-failed }}'.split(',').filter(c => c);

            let comment = `## 🐳 Dockerfile Review\n\n`;
            comment += `Found **${issuesCount}** issue(s):\n\n`;

            if (failedChecks.length > 0) {
              comment += `### Failed Checks\n`;
              failedChecks.forEach(check => {
                comment += `- ❌ ${check}\n`;
              });
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Set check status
        if: always()
        run: |
          if [ "${{ steps.docker-check.outcome }}" == "failure" ]; then
            echo "::error::Dockerfile checks failed"
            exit 1
          fi

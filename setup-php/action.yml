# @format

# @package tomgrv/actions/setup-php

name: Setup php
description: Shared PHP and Composer setup for PR validation actions.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  bare:
    description: >-
      If true, skips the `composer install` step. Useful for actions that only need
      PHP and Composer available, but not the project's dependencies.
    required: false
    default: 'false'
  options:
    description: Additional options to pass to composer install, such as --no-dev.
    required: false
    default: ''
  tools:
    description: Additional tools to install with shivammathur/setup-php, comma-separated.
    required: false
    default: ''
  require:
    description: >-
      Composer packages to install globally (`composer global require`), comma-separated,
      each optionally pinned to a version with `package:constraint` (e.g. `deployer/deployer:^7`).
      Runs on every invocation of this action within a job, regardless of whether the PHP/Composer
      setup itself was skipped as a duplicate - each caller may need a different global package.
      Packages already installed globally are skipped.
    required: false
    default: ''

outputs:
  php-version:
    description: Detected PHP version from composer.json, or default.
    value: ${{ steps.php-version.outputs.version }}
  php-extensions:
    description: Detected PHP extensions from composer.json, or empty.
    value: ${{ steps.php-extensions.outputs.extensions }}

runs:
  using: composite
  steps:
    - name: Extract PHP version from composer.json
      id: php-version
      if: ${{ env.TOMGRV_PHP_SETUP != 'true' && hashFiles('composer.json') }}
      shell: sh
      run: |
        version=$(jq -r '.require.php // empty' composer.json | sed 's/[^0-9.]//g' | cut -d. -f1,2)
        echo "version=${version:-8.3}" >> "$GITHUB_OUTPUT"

    - name: Extract php extensions from composer.json
      id: php-extensions
      if: ${{ env.TOMGRV_PHP_SETUP != 'true' && hashFiles('composer.json') }}
      shell: sh
      run: sh -c "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

    - name: Set up PHP
      id: php-setup
      uses: shivammathur/setup-php@v2
      # Guards against redundant reinstalls when several actions in this
      # repository each embed setup-php within the same job.
      if: env.TOMGRV_PHP_SETUP != 'true'
      with:
        php-version: ${{ steps.php-version.outputs.version }}
        extensions: ${{ steps.php-extensions.outputs.extensions }}
        coverage: xdebug
        tools: ${{ inputs.tools }}

    - name: Install Composer dependencies
      uses: ramsey/composer-install@v3
      id: composer-install
      # Keyed on composer.json, not composer.lock: libraries and packages
      # commonly do not commit a lock file, and skipping the install there
      # leaves every downstream action without a vendor directory.
      if: ${{  env.TOMGRV_PHP_SETUP != 'true' && inputs.bare != 'true' && hashFiles('composer.json') }}
      with:
        composer-options: '--no-progress --no-interaction --ansi --no-suggest --optimize-autoloader ${{ inputs.options }}'

    # Global package installs are per-caller, not per-job: even when the PHP/Composer
    # setup above is skipped as a duplicate, a different action embedding setup-php may
    # still need its own global tool installed, so this always runs. Runs after the
    # project's own `composer install` so require.sh can skip packages already present
    # locally in vendor/, avoiding a redundant (and slower) global install.
    - name: Install global Composer requirements
      id: composer-require
      if: ${{ inputs.require != '' && inputs.bare != 'true' }}
      shell: sh
      env:
        REQUIRE: ${{ inputs.require }}
      run: sh -c "${{ github.action_path }}/require.sh" >> "$GITHUB_OUTPUT"

    - name: Mark PHP toolchain as ready
      if: env.TOMGRV_PHP_SETUP != 'true'
      shell: sh
      run: echo "TOMGRV_PHP_SETUP=true" >> "$GITHUB_ENV"

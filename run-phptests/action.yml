# @format

# @package tomgrv/actions/run-phptests

name: Validate PR Test Suite
description: Run pull request test suite for a PHP matrix version.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting. Reporting is skipped when empty.
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Directory to run the test suite in, relative to the workspace. Defaults to the workspace root.
    required: false
    default: .
  install:
    description: 'Install Composer dependencies when `vendor/autoload.php` is missing [auto,true,false]. `auto` installs when a composer.json is present.'
    required: false
    default: auto
  runner:
    description: 'Test runner to use [auto,pest,phpunit,composer]. `auto` picks pest, then phpunit, then the composer `test` script.'
    required: false
    default: auto
  paths:
    description: Optional paths or filters to pass to the test runner. Defaults to the whole suite.
    required: false
    default: ''
  flags:
    description: Additional flags to pass to the test runner.
    required: false
    default: ''
  coverage:
    description: 'Generate a clover coverage report [auto,true,false]. `auto` skips coverage when no xdebug/pcov driver is loaded.'
    required: false
    default: auto
  coverage-file:
    description: Clover coverage report to write when coverage is enabled.
    required: false
    default: coverage.xml
  junit-file:
    description: JUnit report to write, used to report failing tests with reviewdog.
    required: false
    default: junit.xml
  migrate:
    description: 'Run `artisan migrate` before the suite [auto,true,false]. `auto` migrates when the project has migrations.'
    required: false
    default: auto
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: phpunit
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: >-
      Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].
      Defaults to the reporter resolved by setup-reviewdog for this run's
      context (github-pr-check on pull requests, github-check otherwise).
    required: false
    default: ''
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

outputs:
  tests-passed:
    description: Whether the test suite passed.
    value: ${{ steps.run-phptests.outputs.tests-passed }}
  coverage-file:
    description: Path of the generated coverage report, empty when no report was produced.
    value: ${{ steps.run-phptests.outputs.coverage-file }}
  junit-file:
    description: Path of the generated JUnit report, empty when no report was produced.
    value: ${{ steps.run-phptests.outputs.junit-file }}

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php

    - name: Setup reviewdog toolchain
      uses: $/setup-reviewdog

    - name: Run test suite
      id: run-phptests
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INSTALL: ${{ inputs.install }}
        TEST_RUNNER: ${{ inputs.runner }}
        TEST_PATHS: ${{ inputs.paths }}
        TEST_FLAGS: ${{ inputs.flags }}
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        JUNIT_FILE: ${{ inputs.junit-file }}
        MIGRATE: ${{ inputs.migrate }}
      run: sh -c "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

# @format

# @package tomgrv/actions/check-pr-format

name: Validate PR Format
description: Validate and optionally normalize pull request title format.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token used to update PR title when needed.
    required: false
    default: ${{ github.token }}
  fix:
    description: Autocorrect the PR title (via devmoji) and push it back when possible, instead of only reporting the expected format.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate PR title
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FIX: ${{ inputs.fix }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
      run: sh -c "${{ github.action_path }}/run.sh"

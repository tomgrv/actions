# @format

# @package tomgrv/actions/check-lock

name: Validate PR Lock
description: Validate composer.json/composer.lock (schema, publish-readiness, lock coherence) and package.json/package-lock.json coherence, and report via reviewdog.
author: Perspikapps
branding:
  icon: lock
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  paths:
    description: Comma-separated list of directories to check for lock files.
    required: false
    default: '.'
  reviewdog-version:
    description: Version of reviewdog to install.
    required: false
    default: v0.20.3
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: lock-coherence
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: >-
      Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].
      Defaults to the reporter resolved by setup-reviewdog for this run's
      context (github-pr-check on pull requests, github-check otherwise).
    required: false
    default: ''
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: error
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

outputs:
  has-drift:
    description: 'true if at least one lock file could not be verified as coherent — either it is out of sync with its manifest, or the check itself could not run (tool missing, validator failed) — false otherwise'
    value: ${{ steps.check.outputs.has-drift }}
  drift-files:
    description: Comma-separated list of lock files that triggered a finding (out of sync, or unverifiable).
    value: ${{ steps.check.outputs.drift-files }}

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      id: setup-php
      if: ${{ hashFiles('**/composer.json') || hashFiles('**/composer.lock') }}
      uses: $/setup-php

    - name: Setup Node toolchain
      id: setup-node
      if: ${{ hashFiles('**/package.json') || hashFiles('**/package-lock.json') }}
      uses: $/setup-node

    - name: Setup reviewdog toolchain
      id: setup-reviewdog
      uses: $/setup-reviewdog
      with:
        version: ${{ inputs.reviewdog-version }}
        github-token: ${{ inputs.github-token }}

    - name: Check lock coherence
      id: check
      if: ${{ hashFiles('**/composer.json') || hashFiles('**/composer.lock') || hashFiles('**/package.json') || hashFiles('**/package-lock.json') }}
      shell: sh
      env:
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
      run: sh -c "${{ github.action_path }}/run.sh" "${{ inputs.paths }}" >> "$GITHUB_OUTPUT"

# @format

# @package tomgrv/actions/react-comment

name: Confirm comment
description: Add a reaction emoji to the current GitHub event comment.
author: Perspikapps
branding:
  icon: eye
  color: yellow

inputs:
  github-token:
    description: GitHub token with permission to add reactions.
    required: true
  repository:
    description: Repository in the format "owner/name". Used when comment-url is not provided.
    required: false
    default: ''
  comment-url:
    description: API URL of the comment to react to. Defaults to github.event.comment.url.
    required: false
    default: ${{ github.event.comment.url }}
  comment-id:
    description: Numeric comment ID. Used with repository when comment-url is not provided.
    required: false
    default: ${{ github.event.comment.id }}
  reaction:
    description: Reaction to add. Supports GitHub values (+1, -1, laugh, confused, heart, hooray, rocket, eyes) and emoji aliases (👍, 👎, 😄, 😕, ❤️, 🎉, 🚀, 👀).
    required: false
    default: '+1'

outputs:
  reaction-id:
    description: ID of the created (or existing) reaction.
    value: ${{ steps.react-comment.outputs.reaction-id }}
  reaction-content:
    description: Normalized GitHub reaction content value.
    value: ${{ steps.react-comment.outputs.reaction-content }}
  comment-url:
    description: API URL of the comment that was reacted to.
    value: ${{ steps.react-comment.outputs.comment-url }}

runs:
  using: composite
  steps:
    - name: Add reaction to comment
      id: react-comment
      shell: sh
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
        COMMENT_URL: ${{ inputs.comment-url }}
        COMMENT_ID: ${{ inputs.comment-id }}
        REACTION: ${{ inputs.reaction }}
      run: sh -c "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

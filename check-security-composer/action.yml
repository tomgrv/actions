# @format

# @package tomgrv/actions/check-security-composer

name: Validate PR Security Composer
description: Run Composer dependency security audit and report via reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: ${{ github.action }}
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: >-
      Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].
      Defaults to the reporter resolved by setup-reviewdog for this run's
      context (github-pr-check on pull requests, github-check otherwise),
      which posts a Check annotation for every finding regardless of whether
      the PR touches the manifest file. Set explicitly to github-pr-review to
      post applyable version-bump suggestions instead, but only for findings
      on lines already part of the PR diff; everything else is dropped to a
      generic rolled-up comment.
    required: false
    default: ''
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''
  max-diagnostics:
    description: "Maximum number of vulnerability diagnostics to report, most severe first. Extra findings are collapsed into a single summary diagnostic to stay under GitHub's annotation limits."
    required: false
    default: '10'

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php

    - name: Setup Reviewdog toolchain
      uses: $/setup-reviewdog
      with:
        github-token: ${{ inputs.github-token }}

    - name: Run composer security audit
      shell: sh
      env:
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter || env.REVIEWDOG_REPORTER }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
        MAX_DIAGNOSTICS: ${{ inputs.max-diagnostics }}
      run: sh -c "${{ github.action_path }}/run.sh"

# @format

# @package tomgrv/actions/setup-scripts

name: Setup Scripts
description: Idempotently bootstrap zz_use from tomgrv/scripts, optionally installing specific scripts onto PATH.
author: Perspikapps
branding:
  icon: download
  color: blue

inputs:
  scripts:
    description: Space-separated tomgrv/scripts tool names to zz_use after bootstrapping (e.g. "git-release-beta git-release-prod"). Leave empty to only bootstrap zz_use itself.
    required: false
    default: ''
  scripts-ref:
    description: tomgrv/scripts ref (tag/branch/commit) every name in `scripts` is pinned to, as "<name>@<ref>". Leave empty to use each script's own default origin/ref.
    required: false
    default: ''
  scripts-branch:
    description: Branch to fetch tomgrv/scripts setup.sh from when bootstrapping zz_use (default "main", typically overridden to a development branch during integration testing).
    required: false
    default: main

runs:
  using: composite
  steps:
    # Cache key must track the actual commit tomgrv/scripts is at, not just
    # its branch name -- a name-only key (e.g. "...-main-") never changes as
    # the branch moves forward, so a cache entry saved before some script
    # existed on that branch would be restored forever after, even once the
    # script is genuinely there. restore-keys prefix fallbacks have the same
    # problem (they'd match an older SHA's entry), so this step deliberately
    # has none: a cache miss just means zz_use fetches fresh, which it
    # already handles correctly on its own.
    - name: Resolve tomgrv/scripts branch SHA
      id: scripts-sha
      shell: sh
      run: |
        sha=$(git ls-remote https://github.com/tomgrv/scripts.git "${{ inputs.scripts-branch }}" | cut -f1)
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - name: Cache zz_scripts (extracted tomgrv/scripts archives)
      uses: actions/cache@v5
      with:
        path: ~/.cache/zz_scripts
        key: zz_scripts-${{ runner.os }}-${{ inputs.scripts-branch }}-${{ inputs.scripts-ref }}-${{ steps.scripts-sha.outputs.sha }}

    - name: Bootstrap zz_use and install requested scripts
      shell: sh
      env:
        SCRIPTS: ${{ inputs.scripts }}
        SCRIPTS_REF: ${{ inputs.scripts-ref }}
        ZZ_SCRIPTS_BRANCH: ${{ inputs.scripts-branch }}
      run: sh -c "${{ github.action_path }}/run.sh"

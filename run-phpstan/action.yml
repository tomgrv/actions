# @format

# @package tomgrv/actions/run-phpstan

name: Validate PR PHPStan
description: Run PHPStan with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: true
  paths:
    description: Paths to analyze with PHPStan, comma-separated. Defaults to `app`
    required: false
    default: app
  fix:
    description: Enable baseline generation mode instead of reviewdog reporting.
    required: false
    default: 'false'
  baseline-file:
    description: Baseline file generated when fix mode is enabled.
    required: false
    default: phpstan-baseline.neon

outputs:
  has-changes:
    description: Whether fix mode produced changes.
    value: ${{ steps.run-phpstan.outputs.has-changes }}
  changed-files:
    description: Comma-separated list of files touched by fix mode.
    value: ${{ steps.run-phpstan.outputs.changed-files }}

runs:
  using: composite
  steps:
    - name: Ensure PHPStan is installed
      shell: sh
      run: |
        [ -f vendor/bin/phpstan ] || composer require --dev phpstan/phpstan --no-interaction --no-progress --quiet

    - name: Run PHPStan
      id: run-phpstan
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        FIX: ${{ inputs.fix }}
        BASELINE_FILE: ${{ inputs.baseline-file }}
      run: sh -c "${{ github.action_path }}/run.sh ${{inputs.paths}}" >> "$GITHUB_OUTPUT"

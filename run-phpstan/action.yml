# @format

# @package tomgrv/actions/run-phpstan

name: Validate PR PHPStan
description: Run PHPStan with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  paths:
    description: Paths to analyze with PHPStan, comma-separated. Defaults to `app`.
    required: false
    default: app
  fix:
    description: Generate a PHPStan baseline file instead of reporting via reviewdog.
    required: false
    default: 'false'
  baseline-file:
    description: Baseline file to generate when fix mode is enabled.
    required: false
    default: phpstan-baseline.neon
  dirty:
    description: Only analyze files with uncommitted git changes (staged, unstaged, or untracked).
    required: false
    default: 'false'
  wip:
    description: Only analyze files changed on the current pull request (relative to its base branch).
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  config:
    description: >-
      Path to a custom PHPStan configuration file. Leave empty to let PHPStan
      auto-detect `phpstan.neon`/`phpstan.neon.dist`/`phpstan.dist.neon` at the
      repository root, or fall back to its own defaults otherwise.
    required: false
    default: ''
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: phpstan
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: 'Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].'
    required: false
    default: github-pr-check
  filter-mode:
    description: 'Filtering mode for the reviewdog command [added,diff_context,file,nofilter].'
    required: false
    default: added
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: '-tee'

outputs:
  has-changes:
    description: Whether fix mode produced changes to the baseline file.
    value: ${{ steps.run-phpstan.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php
      with:
        require: phpstan/phpstan

    - name: Setup reviewdog toolchain
      uses: $/setup-reviewdog

    - name: List dirty files
      id: list-dirty
      if: inputs.dirty == 'true'
      uses: $/list-dirty
      with:
        path: ${{ inputs.paths }}
        extensions: php

    - name: List WIP files
      id: list-wip
      if: inputs.wip == 'true'
      uses: $/list-wip
      with:
        path: ${{ inputs.paths }}
        extensions: php
        base-ref: ${{ inputs.wip-base-ref }}

    - name: Run PHPStan
      id: run-phpstan
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        TARGET_PATHS: ${{ inputs.paths }}
        FIX: ${{ inputs.fix }}
        BASELINE_FILE: ${{ inputs.baseline-file }}
        DIRTY: ${{ inputs.dirty }}
        WIP: ${{ inputs.wip }}
        DIRTY_FILES: ${{ steps.list-dirty.outputs.files }}
        WIP_FILES: ${{ steps.list-wip.outputs.files }}
        PHPSTAN_CONFIG: ${{ inputs.config }}
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FILTER_MODE: ${{ inputs.filter-mode }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
      run: sh -c "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

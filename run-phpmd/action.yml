# @format

# @package tomgrv/actions/run-phpmd

name: Validate PR PHPMD
description: Run PHPMD with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  paths:
    description: Paths to analyze with PHPMD, comma-separated. Defaults to `app`.
    required: false
    default: app
  ruleset:
    description: >-
      PHPMD ruleset to use: comma-separated rule set names (e.g. `cleancode,codesize`)
      and/or paths to custom ruleset XML files. Leave empty to automatically use
      `phpmd.xml` from the repository root when present, or fall back to the default
      ruleset (`cleancode,codesize,controversial,design,naming,unusedcode`) otherwise.
    required: false
    default: ''
  priority:
    description: Priority of issues to report (min/max). Defaults to max.
    required: false
    default: max
  dirty:
    description: Only analyze files with uncommitted git changes (staged, unstaged, or untracked).
    required: false
    default: 'false'
  wip:
    description: Only analyze files changed on the current pull request (relative to its base branch).
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: phpmd
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: 'Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].'
    required: false
    default: github-pr-check
  filter-mode:
    description: 'Filtering mode for the reviewdog command [added,diff_context,file,nofilter].'
    required: false
    default: nofilter
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php
      with:
        require: phpmd/phpmd

    - name: Setup reviewdog toolchain
      uses: $/setup-reviewdog

    - name: Cache baseline report
      uses: actions/cache@v5
      with:
        path: .phpmd.result-cache.php
        key: ${{ runner.os }}-phpmd
        restore-keys: |
          ${{ runner.os }}-phpmd-

    - name: Run PHPMD
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        PHPMD_PATHS: ${{ inputs.paths }}
        PHPMD_RULESET: ${{ inputs.ruleset }}
        PHPMD_PRIORITY: ${{ inputs.priority }}
        DIRTY: ${{ inputs.dirty }}
        WIP: ${{ inputs.wip }}
        WIP_BASE_REF: ${{ inputs.wip-base-ref }}
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FILTER_MODE: ${{ inputs.filter-mode }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
      run: sh "${{ github.action_path }}/run.sh"

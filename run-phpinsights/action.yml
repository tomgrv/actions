# @format

# @package tomgrv/actions/run-phpinsights

name: Validate PR PHP Insights
description: Run PHP Insights with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  paths:
    description: Paths to analyze with PHP Insights, comma-separated. Defaults to `app`.
    required: false
    default: app
  fix:
    description: Apply fixes directly instead of reporting via reviewdog.
    required: false
    default: 'false'
  config-path:
    description: >-
      Path to a custom PHP Insights configuration file. Leave empty to let PHP
      Insights auto-detect `phpinsights.json` (or `config/insights.php` in
      Laravel apps) at the repository root, or fall back to its own defaults
      otherwise.
    required: false
    default: ''
  dirty:
    description: Only analyze files with uncommitted git changes (staged, unstaged, or untracked).
    required: false
    default: 'false'
  wip:
    description: Only analyze files changed on the current pull request (relative to its base branch).
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: phpinsights
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: 'Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].'
    required: false
    default: github-pr-check
  filter-mode:
    description: 'Filtering mode for the reviewdog command [added,diff_context,file,nofilter].'
    required: false
    default: added
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

outputs:
  has-changes:
    description: Whether fix mode produced local changes.
    value: ${{ steps.run-phpinsights.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php
      with:
        require: nunomaduro/phpinsights

    - name: Setup reviewdog toolchain
      uses: $/setup-reviewdog

    - name: Run PHP Insights
      id: run-phpinsights
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        TARGET_PATHS: ${{ inputs.paths }}
        FIX: ${{ inputs.fix }}
        PHPINSIGHTS_CONFIG_PATH: ${{ inputs.config-path }}
        DIRTY: ${{ inputs.dirty }}
        WIP: ${{ inputs.wip }}
        WIP_BASE_REF: ${{ inputs.wip-base-ref }}
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FILTER_MODE: ${{ inputs.filter-mode }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
      run: sh "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

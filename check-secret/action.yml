# @format

# @package tomgrv/actions/check-secret

name: Validate PR Secrets
description: Scan pull request changes for secrets.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for gitleaks action.
    required: true
  gitleaks-license:
    description: Gitleaks license key for private repositories. Not required for public repositories.
    required: false

runs:
  using: composite
  steps:
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITLEAKS_LICENSE: ${{ inputs.gitleaks-license }}

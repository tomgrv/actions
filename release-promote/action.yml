# @format

# @package tomgrv/actions/release-promote

name: Release Promote
description: Run git-release-beta then git-release-prod (git-flow beta->prod promotion) against the checked-out repo.
author: Perspikapps
branding:
  icon: upload-cloud
  color: blue

inputs:
  scripts-ref:
    description: tomgrv/scripts ref (tag/branch/commit) to pull git-release-beta/git-release-prod from.
    required: true
  dry-run:
    description: Run through beta/prod without pushing to main (verification only).
    required: false
    default: 'false'
  github-token:
    description: GitHub token used for the release push and for the git bot identity.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Configure git bot identity
      # Relative reference, not @main: this resolves against the same
      # ref/checkout release-promote itself was invoked at, so it works
      # from a branch (this repo's own release-main.yml, before anything
      # here has ever been tagged) as well as from a released tag -- @main
      # would 404 on a sibling action that hasn't reached main yet.
      uses: ./config-bot
      with:
        github-token: ${{ inputs.github-token }}

    - name: Install release scripts
      uses: ./setup-scripts
      with:
        scripts: git-release-beta git-release-prod
        scripts-ref: ${{ inputs.scripts-ref }}

    - name: Install GitVersion toolchain
      uses: ./setup-gitversion

    - name: Run beta then prod
      shell: sh
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: sh -c "${{ github.action_path }}/run.sh"

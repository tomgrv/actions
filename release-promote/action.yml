# @format

# @package tomgrv/actions/release-promote

name: Release Promote
description: Run git-release-beta then git-release-prod (git-flow beta->prod promotion) against the checked-out repo.
author: Perspikapps
branding:
  icon: upload-cloud
  color: blue

inputs:
  scripts-ref:
    description: tomgrv/scripts ref (tag/branch/commit) to pull git-release-beta/git-release-prod from.
    required: true
  dry-run:
    description: Run through beta/prod without pushing to main (verification only).
    required: false
    default: 'false'
  github-token:
    description: GitHub token used for the release push and for the git bot identity.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # release-promote is uniquely self-referential: it releases the very
    # repo it's defined in, so any sibling action whose *content* changes
    # in the same release (config-bot/setup-gitversion/setup-gitflow's own
    # run.sh) cannot be called via a fixed `uses: tomgrv/actions/<name>@v2`
    # -- that ref necessarily predates whatever this release is about to
    # ship, so it silently runs the *old* sibling instead of the one just
    # merged. Confirmed live: setup-gitversion@v2 still curled bin/*.sh out
    # of tomgrv/devcontainer-features after that repo deleted them (404),
    # because @v2 was cut before the fix that stopped doing that ever
    # existed. `uses: ./<name>` doesn't fix this either -- that resolves
    # against the *calling* repo's checkout when release-promote itself is
    # invoked from elsewhere (e.g. tomgrv/scripts), not this one.
    #
    # So each sibling's own run.sh is invoked directly via
    # github.action_path here, which always resolves to wherever *this*
    # release-promote's own checkout landed -- immune to the staleness
    # above, for any ref/caller. Each sibling's own "Setup scripts
    # toolchain" sub-step (installing zz_log/gv/bump-*/etc from
    # tomgrv/scripts) stays pinned to `@v2` as normal: that's an external
    # repo released independently of this one, not something this release
    # cycle could make stale.
    - name: Setup scripts toolchain
      uses: tomgrv/actions/setup-scripts@v2
      with:
        # bump-version (installed separately by setup-gitversion, from
        # tomgrv/devcontainer-features) shells out to `git workspaces` for
        # its minimal-mode affected-workspace check -- without it on PATH
        # that call silently fails (git: 'workspaces' is not a git command,
        # swallowed by bump-version's own `2>/dev/null || echo ""`), so
        # every workspace looks unaffected and per-workspace version files
        # never get bumped.
        scripts: git-release-beta git-release-prod git-workspaces zz_log
        scripts-ref: ${{ inputs.scripts-ref }}

    - name: Configure git bot identity
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        user_id=$(gh api "/users/github-actions[bot]" --jq .id)
        BOT_NAME="github-actions[bot]" BOT_EMAIL="${user_id}+github-actions[bot]@users.noreply.github.com" \
          sh -c "${{ github.action_path }}/../config-bot/run.sh"

    - name: Setup GitVersion scripts toolchain
      uses: tomgrv/actions/setup-scripts@v2
      with:
        scripts: zz_log gv bump-tag bump-changelog bump-version

    - name: Install GitVersion toolchain
      shell: sh
      run: sh -c "${{ github.action_path }}/../setup-gitversion/run.sh"

    - name: Install and initialize git-flow
      shell: sh
      run: sh -c "${{ github.action_path }}/../setup-gitflow/run.sh"

    - name: Run beta then prod
      shell: sh
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: sh -c "${{ github.action_path }}/run.sh"

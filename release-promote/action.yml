# @format

# @package tomgrv/actions/release-promote

name: Release Promote
description: Run git-release-beta then git-release-prod (git-flow beta->prod promotion) against the checked-out repo.
author: Perspikapps
branding:
  icon: upload-cloud
  color: blue

inputs:
  scripts-ref:
    description: tomgrv/scripts ref (tag/branch/commit) to pull git-release-beta/git-release-prod from.
    required: true
  dry-run:
    description: Run through beta/prod without pushing to main (verification only).
    required: false
    default: 'false'
  github-token:
    description: GitHub token used for the release push and for the git bot identity.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # These four steps used to invoke each sibling action's run.sh directly
    # via github.action_path instead of `uses: tomgrv/actions/<name>@v2`,
    # to dodge a fixed ref 404ing on a sibling that hadn't reached a release
    # tag yet. The whole repo now ships as one monorepo tag (v2), so every
    # sibling resolves at the same ref release-promote itself resolves at --
    # the same `uses: tomgrv/actions/<name>@v2` pattern every other action
    # in this repo already uses, so use it here too instead of bypassing it.
    - name: Setup scripts toolchain
      uses: tomgrv/actions/setup-scripts@v2
      with:
        # bump-version (installed separately by setup-gitversion, from
        # tomgrv/devcontainer-features) shells out to `git workspaces` for
        # its minimal-mode affected-workspace check -- without it on PATH
        # that call silently fails (git: 'workspaces' is not a git command,
        # swallowed by bump-version's own `2>/dev/null || echo ""`), so
        # every workspace looks unaffected and per-workspace version files
        # never get bumped.
        scripts: git-release-beta git-release-prod git-workspaces zz_log
        scripts-ref: ${{ inputs.scripts-ref }}

    - name: Configure git bot identity
      uses: tomgrv/actions/config-bot@v2
      with:
        github-token: ${{ inputs.github-token }}

    - name: Install GitVersion toolchain
      uses: tomgrv/actions/setup-gitversion@v2

    - name: Install and initialize git-flow
      uses: tomgrv/actions/setup-gitflow@v2

    - name: Run beta then prod
      shell: sh
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: sh -c "${{ github.action_path }}/run.sh"

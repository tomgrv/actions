# @format

# @package tomgrv/actions/check-pr-source-branch

name: Validate PR Target Branch
description: Reject pull requests targeting the main branch unless the title marks them as a hotfix.
author: Perspikapps
branding:
  icon: git-branch
  color: blue

inputs:
  restricted-branch:
    description: Branch name that requires a hotfix-marked title when used as a PR target.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Setup scripts toolchain
      uses: $/setup-scripts
      with:
        scripts: zz_log

    - name: Check PR target branch
      shell: sh
      env:
        TARGET_BRANCH: ${{ github.base_ref }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        RESTRICTED_BRANCH: ${{ inputs.restricted-branch }}
      run: sh -c "${{ github.action_path }}/run.sh"

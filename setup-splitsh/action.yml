# @format

name: 'Install splitsh-lite'
description: 'Downloads, verifies, and installs splitsh-lite on the runner'
branding:
  icon: 'download'
  color: 'blue'

inputs:
  version:
    description: 'splitsh-lite release tag to install (e.g. v1.0.1)'
    required: false
    default: 'v1.0.1'
  arch:
    description: 'Target platform archive name (e.g. linux_amd64)'
    required: false
    default: 'linux_amd64'
  checksum:
    description: 'Expected SHA-256 of the downloaded archive; leave empty to skip verification'
    required: false
    default: '2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc'

runs:
  using: composite
  steps:
    - name: Download and install
      id: install
      shell: sh
      env:
        SPLITSH_VERSION: ${{ inputs.version }}
        SPLITSH_ARCH: ${{ inputs.arch }}
        SPLITSH_CHECKSUM: ${{ inputs.checksum }}
      run: |
        sh -c "./run.sh" >> "$GITHUB_OUTPUT"

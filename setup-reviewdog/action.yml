# @format

# @package tomgrv/actions/setup-reviewdog

name: Setup reviewdog
description: Install reviewdog for actions that report findings as annotations/comments.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: The version of reviewdog to install.
    required: false
    default: v0.20.3

runs:
  using: composite
  steps:
    - name: Set up reviewdog
      uses: reviewdog/action-setup@v1
      with:
        reviewdog_version: ${{ inputs.version }}

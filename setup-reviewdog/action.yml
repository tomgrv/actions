# @format

# @package tomgrv/actions/setup-reviewdog

name: Setup reviewdog
description: Shared reviewdog setup for PR validation actions.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  version:
    description: Version of reviewdog to install.
    required: false
    default: v0.20.3

runs:
  using: composite
  steps:
    - name: Set up reviewdog
      uses: reviewdog/action-setup@v1
      id: reviewdog-setup
      # Guards against redundant reinstalls when several actions in this
      # repository each embed setup-reviewdog within the same job.
      if: env.TOMGRV_REVIEWDOG_SETUP != 'true'
      with:
        reviewdog_version: ${{ inputs.version }}

    - name: Mark reviewdog toolchain as ready
      if: env.TOMGRV_REVIEWDOG_SETUP != 'true'
      shell: sh
      run: echo "TOMGRV_REVIEWDOG_SETUP=true" >> "$GITHUB_ENV"

    - name: Determine reviewdog reporter for this run context
      # Same redundant-reinstall guard as above: several actions in this
      # repository each embed setup-reviewdog within the same job, so only
      # compute this once. `github-pr-check`/`github-pr-review` need a pull
      # request to attach to; `github-check` is the only reporter that works
      # outside one, so non-PR events (push, workflow_dispatch, schedule...)
      # fall back to it.
      if: env.TOMGRV_REVIEWDOG_REPORTER == ''
      shell: sh
      run: |
        case "${GITHUB_EVENT_NAME}" in
          pull_request | pull_request_target)
            reporter=github-pr-check
            ;;
          *)
            reporter=github-check
            ;;
        esac
        echo "TOMGRV_REVIEWDOG_REPORTER=${reporter}" >> "$GITHUB_ENV"

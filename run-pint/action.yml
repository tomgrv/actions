# @format

# @package tomgrv/actions/run-pint

name: Validate PR Pint
description: Run Laravel Pint with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: false
    default: ${{ github.token }}
  paths:
    description: Comma-separated list of paths to analyze with Pint. Defaults to `app`.
    required: false
    default: app
  fix:
    description: Apply fixes directly instead of reporting via reviewdog.
    required: false
    default: 'false'
  preset:
    description: Pint preset to use (e.g. laravel, default, etc.). Defaults to `laravel`. Ignored when `config` is set.
    required: false
    default: laravel
  config:
    description: >-
      Path to a custom Pint configuration file. Leave empty to let Pint
      auto-detect `pint.json` at the repository root, or fall back to `preset`
      otherwise.
    required: false
    default: ''
  dirty:
    description: Only analyze files with uncommitted git changes (staged, unstaged, or untracked).
    required: false
    default: 'false'
  wip:
    description: Only analyze files changed on the current pull request (relative to its base branch).
    required: false
    default: 'false'
  wip-base-ref:
    description: >-
      Base branch/ref to diff against when `wip` is enabled. Defaults to
      `GITHUB_BASE_REF`, which GitHub Actions sets automatically on
      `pull_request` events.
    required: false
    default: ''
  name:
    description: Name reported by reviewdog to identify this check.
    required: false
    default: pint
  level:
    description: 'Report level for reviewdog [info,warning,error].'
    required: false
    default: error
  reporter:
    description: 'Reporter of reviewdog command [github-pr-check,github-check,github-pr-review].'
    required: false
    default: github-pr-check
  filter-mode:
    description: 'Filtering mode for the reviewdog command [added,diff_context,file,nofilter].'
    required: false
    default: added
  fail-level:
    description: 'Exit code for reviewdog if it finds at least the specified level of diagnostic [none,any,info,warning,error].'
    required: false
    default: none
  reviewdog-flags:
    description: Additional reviewdog flags.
    required: false
    default: ''

outputs:
  has-changes:
    description: Whether fix mode produced local changes.
    value: ${{ steps.run-pint.outputs.has-changes }}

runs:
  using: composite
  steps:
    - name: Setup PHP toolchain
      uses: $/setup-php
      with:
        require: laravel/pint

    - name: Setup reviewdog toolchain
      uses: $/setup-reviewdog

    - name: List dirty files
      id: list-dirty
      if: inputs.dirty == 'true'
      uses: $/list-dirty
      with:
        path: ${{ inputs.paths }}
        extensions: php

    - name: List WIP files
      id: list-wip
      if: inputs.wip == 'true'
      uses: $/list-wip
      with:
        path: ${{ inputs.paths }}
        extensions: php
        base-ref: ${{ inputs.wip-base-ref }}

    - name: Run Pint
      id: run-pint
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        PINT_PATHS: ${{ inputs.paths }}
        FIX: ${{ inputs.fix }}
        PINT_PRESET: ${{ inputs.preset }}
        PINT_CONFIG: ${{ inputs.config }}
        DIRTY: ${{ inputs.dirty }}
        WIP: ${{ inputs.wip }}
        DIRTY_FILES: ${{ steps.list-dirty.outputs.files }}
        WIP_FILES: ${{ steps.list-wip.outputs.files }}
        REVIEWDOG_NAME: ${{ inputs.name }}
        REVIEWDOG_REPORTER: ${{ inputs.reporter }}
        REVIEWDOG_LEVEL: ${{ inputs.level }}
        REVIEWDOG_FILTER_MODE: ${{ inputs.filter-mode }}
        REVIEWDOG_FAIL_LEVEL: ${{ inputs.fail-level }}
        REVIEWDOG_FLAGS: ${{ inputs.reviewdog-flags }}
      run: sh "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

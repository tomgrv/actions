# @format

# @package tomgrv/actions/run-pint

name: Validate PR Pint
description: Run Laravel Pint with reviewdog.
author: Perspikapps
branding:
  icon: check-circle
  color: blue

inputs:
  github-token:
    description: GitHub token for reviewdog reporting.
    required: true
  paths:
    description: Comma-separated list of paths to analyze with Pint.
    required: false
    default: app
  fix:
    description: Apply Pint fixes instead of reviewdog reporting.
    required: false
    default: 'false'

outputs:
  has-changes:
    description: Whether fix mode produced changes.
    value: ${{ steps.run-pint.outputs.has-changes }}
  changed-files:
    description: Comma-separated list of files touched by fix mode.
    value: ${{ steps.run-pint.outputs.changed-files }}

runs:
  using: composite
  steps:
    - name: Ensure Pint is installed
      shell: sh
      run: |
        [ -f vendor/bin/pint ] || composer require --dev laravel/pint --no-interaction --no-progress --quiet

    - name: Run Pint
      id: run-pint
      shell: sh
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ inputs.github-token }}
        FIX: ${{ inputs.fix }}
      run: sh -c "${{ github.action_path }}/run.sh ${{inputs.paths}}" >> "$GITHUB_OUTPUT"

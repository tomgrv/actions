# @format

# @package tomgrv/actions/rebase-pr

name: Rebase Pull Request
description: Rebase the current pull request branch onto its base branch.
author: Perspikapps
branding:
  icon: git-pull-request
  color: orange

inputs:
  github-token:
    description: GitHub token with pull request and contents permissions.
    required: true
  repository:
    description: Repository in the format "owner/name". Defaults to the current repository.
    required: false
    default: ''
  pr-number:
    description: Pull request number to rebase. Defaults to the current pull request number.
    required: false
    default: ''
  autosquash:
    description: Whether to autosquash fixup! and squash! commits during rebase.
    required: false
    default: 'false'

outputs:
  head-branch:
    description: Head branch of the rebased pull request.
    value: ${{ steps.rebase-pr.outputs.head_branch }}
  base-branch:
    description: Base branch onto which the pull request was rebased.
    value: ${{ steps.rebase-pr.outputs.base_branch }}
  pr-number:
    description: Pull request number that was rebased.
    value: ${{ steps.rebase-pr.outputs.pr_number }}
  pr-url:
    description: Pull request URL.
    value: ${{ steps.rebase-pr.outputs.pr_url }}
  action:
    description: Action taken by the workflow (rebased, up-to-date, or skip).
    value: ${{ steps.rebase-pr.outputs.action }}

runs:
  using: composite
  steps:
    - name: Rebase pull request
      id: rebase-pr
      shell: sh
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        AUTOSQUASH: ${{ inputs.autosquash }}
      run: sh -c "${{ github.action_path }}/run.sh" >> "$GITHUB_OUTPUT"

# @format

# @package tomgrv/actions/setup-gitflow

name: Setup GitFlow
description: Install the git-flow extension if missing, then initialize it against the checked-out repo (idempotent).
author: Perspikapps
branding:
  icon: git-branch
  color: blue

inputs:
  master-branch:
    description: Branch git-flow treats as production/master.
    required: false
    default: main
  develop-branch:
    description: Branch git-flow treats as develop.
    required: false
    default: develop

runs:
  using: composite
  steps:
    - name: Install and initialize git-flow
      shell: sh
      env:
        GITFLOW_MASTER_BRANCH: ${{ inputs.master-branch }}
        GITFLOW_DEVELOP_BRANCH: ${{ inputs.develop-branch }}
      run: sh -c "${{ github.action_path }}/run.sh"
